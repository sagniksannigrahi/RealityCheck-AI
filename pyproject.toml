[project]
name = "realitycheck-ai"
version = "0.1.0"
description = "Evidence-grounded verification of claims in AI-generated image and video descriptions."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.30,<2.1",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10",
  "pillow>=10.4",
  "spacy>=3.7,<3.9",
  "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
ml = [
  "torch>=2.4",
  "torchvision>=0.19",
  "ultralytics>=8.3",
  "transformers>=4.46,<5",
  "accelerate>=0.34",
]
external = ["anthropic>=0.40"]
s3 = ["boto3>=1.34"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = [
  "slow: tests that load real ML models (deselect with -m 'not slow')",
]
addopts = "-ra -m 'not slow'"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "S311", "E501", "UP046"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S", "B"]

# CPU-only PyTorch wheels on Linux (Docker/CI): avoids ~2.5 GB of CUDA libraries. macOS uses PyPI wheels (CPU/MPS).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
